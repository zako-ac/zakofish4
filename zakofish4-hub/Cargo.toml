[package]
name = "zakofish4-hub"
version = "0.1.0"
edition = "2024"
description = "Drives the zakofish4 hub state machine over a WebSocket-shaped transport."

[dependencies]
zakofish4-common = { path = "../zakofish4-common", version = "0.1.0" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
