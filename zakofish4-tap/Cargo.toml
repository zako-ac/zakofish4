[package]
name = "zakofish4-tap"
version = "0.1.0"
edition = "2024"
description = "SDK for building a Zako4 tap: gateway WebSocket plus protofish4 audio delivery."

[features]
# Turn an encoded audio file into Opus frames with ffmpeg. Almost every tap
# wants this; it is a feature because it pulls in an ogg parser and assumes
# ffmpeg on PATH.
auto-encode = ["dep:ogg", "dep:tokio-stream"]
# An HTTP /health endpoint, for taps running under an orchestrator.
healthcheck = ["dep:axum"]

[dependencies]
zakofish4-common = { path = "../zakofish4-common", version = "0.1.0" }
protofish4 = { git = "https://github.com/zako-ac/protofish4-rs" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "process", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
bytes = "1"

ogg = { version = "0.9", features = ["async"], optional = true }
tokio-stream = { version = "0.1", optional = true }
axum = { version = "0.7", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
zakofish4-hub = { path = "../zakofish4-hub", version = "0.1.0" }
